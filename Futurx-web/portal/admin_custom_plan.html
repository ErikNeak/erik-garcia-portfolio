<!DOCTYPE html>
<html class="dark" lang="es">
<head>
    <meta name="description" content="Consola de administración de planes de diseño y desarrollo de Futurx Studio." />
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Generador de Planes - Admin Futurx</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <style>
        html { scroll-behavior: smooth; }
        body {
            background-color: #0a0a0a;
            font-family: 'Red Hat Display', sans-serif;
            color: #f1e0d1;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .liquid-glass {
            background: rgba(22, 22, 22, 0.7);
            backdrop-filter: blur(20px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .grainy-gradient {
            background-image: radial-gradient(circle at 50% 50%, rgba(255, 158, 0, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 10% 20%, rgba(0, 196, 188, 0.1) 0%, transparent 40%);
        }
    </style>
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="../imag/Icono naranja.png">
    <link rel="apple-touch-icon" href="../imag/Icono naranja.png">
    <link rel="icon" type="image/svg+xml" href="../imag/favicon.svg">
</head>

<body class="grainy-gradient p-6">
    <div class="max-w-xl w-full">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-black text-white tracking-tighter mb-2">Creador de Planes <span class="text-[#ff9e00]">Custom</span></h1>
            <p class="text-white/40 font-sans text-sm">Herramienta interna para generar links de pago a la medida.</p>
            <div class="flex flex-col items-center mt-4 gap-3">
                <button onclick="prefillVIP()" class="px-6 py-2 bg-blue-500/20 border border-blue-500/40 text-blue-400 rounded-full text-[10px] font-black uppercase tracking-widest hover:bg-blue-500 hover:text-white transition-all">Acceso Total (VIP)</button>
                <div class="flex gap-2 w-full max-w-sm">
                    <input id="direct-email-input" type="email" placeholder="Correo a activar VIP..." class="flex-1 bg-white/5 border-white/10 border rounded-xl px-4 py-2 text-xs text-white focus:border-blue-500 outline-none">
                    <button id="activate-by-email-btn" class="bg-blue-600 px-4 py-2 rounded-xl text-[10px] font-bold text-white hover:bg-blue-500 transition-all">Activar Ya</button>
                </div>
            </div>
        </div>

        <div class="liquid-glass p-8 md:p-10 rounded-[2.5rem] shadow-2xl relative overflow-hidden">
            <form id="custom-plan-form" class="relative z-10 space-y-6">
                <div class="space-y-2">
                    <label class="font-sans text-xs uppercase tracking-widest text-white/60 px-2">Buscar Cliente</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-white/20">search</span>
                        <input id="client-search" type="text" 
                            class="w-full bg-[#0a0a0a] border-white/10 border focus:border-[#ff9e00] focus:ring-1 focus:ring-[#ff9e00] rounded-xl py-4 pl-12 pr-5 text-white transition-all placeholder:text-white/20"
                            placeholder="Nombre o email..." />
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="font-sans text-xs uppercase tracking-widest text-white/60 px-2">Seleccionar Cliente de la Lista</label>
                    <select id="client-select" required size="5"
                        class="w-full bg-[#0a0a0a] border-white/10 border focus:border-[#ff9e00] focus:ring-1 focus:ring-[#ff9e00] rounded-xl py-2 px-5 text-white transition-all appearance-none cursor-pointer custom-scrollbar">
                        <option value="" disabled selected>Cargando clientes...</option>
                    </select>
                </div>

                <div class="space-y-2">
                    <label class="font-sans text-xs uppercase tracking-widest text-white/60 px-2">Nombre del Plan Custom</label>
                    <input id="plan-name" type="text" required
                        class="w-full bg-[#0a0a0a] border-white/10 border focus:border-[#ff9e00] focus:ring-1 focus:ring-[#ff9e00] rounded-xl py-4 px-5 text-white transition-all placeholder:text-white/20"
                        placeholder="Ej. Plan Híbrido Elite" />
                </div>

                <div class="space-y-2">
                    <label class="font-sans text-xs uppercase tracking-widest text-white/60 px-2">Precio Mensual (MXN)</label>
                    <input id="plan-price" type="text" required
                        class="w-full bg-[#0a0a0a] border-white/10 border focus:border-[#ff9e00] focus:ring-1 focus:ring-[#ff9e00] rounded-xl py-4 px-5 text-white transition-all placeholder:text-white/20"
                        placeholder="Ej. 10,500" />
                </div>

                <div class="space-y-2">
                    <label class="font-sans text-xs uppercase tracking-widest text-white/60 px-2">Límite de Bomberazos al Mes</label>
                    <input id="plan-bomberazos" type="number" min="0" required
                        class="w-full bg-[#0a0a0a] border-white/10 border focus:border-[#ff9e00] focus:ring-1 focus:ring-[#ff9e00] rounded-xl py-4 px-5 text-white transition-all placeholder:text-white/20"
                        placeholder="Ej. 6" />
                </div>

                <button type="submit"
                    class="w-full py-4 bg-[#ff9e00] text-[#1a120a] rounded-xl font-bold hover:shadow-[0_0_30px_rgba(255,158,0,0.4)] transition-all active:scale-95 flex items-center justify-center gap-2 mt-4">
                    <span class="material-symbols-outlined">send</span>
                    Enviar Propuesta al Cliente
                </button>

                <button type="button" id="direct-vip-btn"
                    class="w-full py-4 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition-all active:scale-95 flex items-center justify-center gap-2 mt-2">
                    <span class="material-symbols-outlined">auto_awesome</span>
                    Activar VIP Directo (Sin Cobro)
                </button>
            </form>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const clientSelect = document.getElementById('client-select');
        const form = document.getElementById('custom-plan-form');
        const submitBtn = form.querySelector('button[type="submit"]');

        let allUsers = [];

        // Cargar usuarios al iniciar
        async function loadUsers() {
            try {
                console.log("Intentando cargar usuarios de Firestore...");
                const usersSnapshot = await getDocs(collection(db, "users"));
                console.log("Usuarios encontrados:", usersSnapshot.size);
                
                allUsers = [];
                usersSnapshot.forEach((doc) => {
                    allUsers.push({ id: doc.id, ...doc.data() });
                });

                renderUserList(allUsers);
            } catch (error) {
                console.error("Error cargando usuarios:", error);
                clientSelect.innerHTML = `<option value="" disabled selected>Error: ${error.message}</option>`;
            }
        }

        function renderUserList(users) {
            clientSelect.innerHTML = '';
            if (users.length === 0) {
                clientSelect.innerHTML = '<option value="" disabled>No se encontraron clientes</option>';
                return;
            }

            users.forEach((user) => {
                const option = document.createElement('option');
                option.value = user.id;
                option.textContent = `${user.name || 'Sin Nombre'} (${user.email})`;
                option.className = "py-2 border-b border-white/5 last:border-0";
                clientSelect.appendChild(option);
            });
        }

        // Filtro de búsqueda
        document.getElementById('client-search').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allUsers.filter(u => 
                (u.name && u.name.toLowerCase().includes(query)) || 
                (u.email && u.email.toLowerCase().includes(query))
            );
            renderUserList(filtered);
        });

        loadUsers();

        // Prefill VIP
        window.prefillVIP = () => {
            document.getElementById('plan-name').value = 'Acceso Total (VIP)';
            document.getElementById('plan-price').value = '0';
            document.getElementById('plan-bomberazos').value = '99';
        };

        // Activar VIP por Email Directo
        document.getElementById('activate-by-email-btn').onclick = async () => {
            const email = document.getElementById('direct-email-input').value.trim();
            if (!email) {
                alert("Ingresa un correo.");
                return;
            }

            if (!confirm(`¿Activar VIP para ${email}?`)) return;

            try {
                const { collection, query, where, getDocs } = await import("https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js");
                const q = query(collection(db, "users"), where("email", "==", email));
                const snap = await getDocs(q);
                
                if (snap.empty) {
                    alert("No se encontró el usuario con ese correo en Firestore.");
                    return;
                }

                const userRef = doc(db, "users", snap.docs[0].id);
                await updateDoc(userRef, {
                    planActual: "Acceso Total (VIP)",
                    bomberazosMax: 99,
                    bomberazosUsed: 0,
                    billingCycleStart: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                });
                alert("¡VIP activado exitosamente!");
            } catch (error) {
                alert("Error: " + error.message);
            }
        };

        // Activar VIP Directo de la Lista

        // Enviar Propuesta
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const clientId = clientSelect.value;
            const name = document.getElementById('plan-name').value.trim();
            const price = document.getElementById('plan-price').value.trim();
            const bomberazos = parseInt(document.getElementById('plan-bomberazos').value.trim(), 10);

            if (!clientId) {
                alert('Por favor selecciona un cliente de la lista.');
                return;
            }

            const originalBtnHtml = submitBtn.innerHTML;
            submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Procesando...';
            submitBtn.disabled = true;

            try {
                const userRef = doc(db, "users", clientId);
                await updateDoc(userRef, {
                    proposedPlan: {
                        name: name,
                        price: price,
                        bomberazos: bomberazos,
                        date: new Date().toISOString()
                    }
                });
                
                alert('¡Propuesta enviada con éxito! El cliente la verá en su Panel.');
                form.reset();
            } catch (error) {
                console.error("Error enviando propuesta:", error);
                alert("Hubo un error al enviar la propuesta. Revisa la consola.");
            } finally {
                submitBtn.innerHTML = originalBtnHtml;
                submitBtn.disabled = false;
            }
        });
    </script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>AOS.init({duration: 800, once: true});</script>
</body>
</html>
